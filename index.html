
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatExpert Tactical SatCom Intelligence (TSI)</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // Safeguard globally against unhandled web sockets in development/sandboxed layers & suppress benign Firestore/HMR stream errors
    (function() {
      const isBenignMessage = (str) => {
        if (!str) return false;
        const lower = String(str).toLowerCase();
        return (
          lower.includes('@firebase/firestore') ||
          lower.includes('webchannelconnection') ||
          lower.includes('failed to obtain primary lease') ||
          lower.includes("rpc 'write' stream") ||
          lower.includes("rpc 'listen' stream") ||
          lower.includes('could not reach cloud firestore backend') ||
          lower.includes('primary lease for action') ||
          lower.includes('websocket closed without opened') ||
          lower.includes('[vite] failed to connect to websocket') ||
          lower.includes('[vite] connecting...') ||
          lower.includes('closed without opened') ||
          lower.includes('suppressed benign')
        );
      };

      const filterArgs = (args) => {
        const fullStr = args.map(arg => {
          try {
            return typeof arg === 'string' ? arg : (arg?.stack || arg?.message || JSON.stringify(arg));
          } catch(e) {
            return String(arg);
          }
        }).join(' ');
        return isBenignMessage(fullStr);
      };

      // Overriding console.warn, console.error, console.debug to filter out benign sandbox/HMR warnings
      const origWarn = console.warn;
      const origError = console.error;
      const origDebug = console.debug;

      console.warn = function(...args) {
        if (filterArgs(args)) return;
        origWarn.apply(console, args);
      };

      console.error = function(...args) {
        if (filterArgs(args)) return;
        origError.apply(console, args);
      };

      if (origDebug) {
        console.debug = function(...args) {
          if (filterArgs(args)) return;
          origDebug.apply(console, args);
        };
      }

      const OriginalWebSocket = window.WebSocket;
      if (OriginalWebSocket) {
        const CustomWebSocket = function(url, protocols) {
          const isFirebaseOrGoogle = typeof url === 'string' && (url.includes('googleapis.com') || url.includes('firebase') || url.includes('google'));
          if (!isFirebaseOrGoogle && typeof url === 'string' && (url.includes('ws://') || url.includes('wss://') || url.includes('/vite') || url.includes(':3000'))) {
            const listeners = { open: [], message: [], error: [], close: [] };
            const dummySocket = {
              url: url,
              readyState: 1, // OPEN to prevent Vite reconnection loops
              bufferedAmount: 0,
              extensions: '',
              protocol: protocols || '',
              binaryType: 'blob',
              send: function() {},
              close: function(code, reason) {
                dummySocket.readyState = 3;
                setTimeout(() => {
                  const ev = { type: 'close', wasClean: true, code: code || 1000, reason: reason || '' };
                  if (typeof dummySocket.onclose === 'function') {
                    try { dummySocket.onclose(ev); } catch (e) {}
                  }
                  listeners.close.forEach(fn => { try { fn(ev); } catch (e) {} });
                }, 0);
              },
              addEventListener: function(type, listener) {
                if (listeners[type]) {
                  listeners[type].push(listener);
                }
                if (type === 'open' && dummySocket.readyState === 1) {
                  setTimeout(() => {
                    try { listener(new Event('open')); } catch(e) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, listener) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(l => l !== listener);
                }
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null
            };

            setTimeout(() => {
              if (dummySocket.readyState === 1) {
                if (typeof dummySocket.onopen === 'function') {
                  try { dummySocket.onopen(new Event('open')); } catch (e) {}
                }
              }
            }, 0);

            return dummySocket;
          }
          return new OriginalWebSocket(url, protocols);
        };
        CustomWebSocket.prototype = OriginalWebSocket.prototype;
        CustomWebSocket.CONNECTING = 0;
        CustomWebSocket.OPEN = 1;
        CustomWebSocket.CLOSING = 2;
        CustomWebSocket.CLOSED = 3;
        window.WebSocket = CustomWebSocket;
        Object.setPrototypeOf(window.WebSocket, OriginalWebSocket);
      }
    })();
  </script>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>
  <div class="crt-flicker"></div>
  <div id="error-box" style="position:fixed; z-index:999999; background:red; color:white; padding:20px; font-family:monospace; display:none; top:0; left:0; right:0; max-height:100vh; overflow:auto;"></div>
  <script>
    // Early escape check for benign development WebSocket / HMR warning messages
    function isBenignHmrError(str) {
      if (!str) return false;
      const lower = str.toLowerCase();
      return (
        lower.includes('websocket') ||
        lower.includes('connection failed') ||
        lower.includes('closed without opened') ||
        lower.includes('vite') ||
        lower.includes('hmr') ||
        lower.includes('heartbeat') ||
        lower.includes('firestore') ||
        lower.includes('webchannelconnection') ||
        lower.includes('could not reach cloud firestore')
      );
    }

    window.onerror = function(message, source, lineno, colno, error) {
      const msgStr = typeof message === 'string' ? message : (message?.message || String(message || ''));
      const srcStr = String(source || '');
      if (isBenignHmrError(msgStr) || isBenignHmrError(srcStr)) {
        return true; // Fully prevent browser error reporting and noisy warnings
      }
      
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerHTML = `<h3>Uncaught Runtime Error</h3>
          <b>Message:</b> ${message}<br/>
          <b>Source:</b> ${source}:${lineno}:${colno}<br/>
          <b>Stack:</b> <pre>${error ? error.stack : 'No stack available'}</pre>`;
      }
      return false;
    };

    window.addEventListener('unhandledrejection', function(event) {
      let reasonStr = '';
      if (event.reason) {
        if (typeof event.reason === 'string') {
          reasonStr = event.reason;
        } else if (event.reason instanceof Error) {
          reasonStr = event.reason.name + ': ' + event.reason.message + '\n' + (event.reason.stack || '');
        } else {
          reasonStr = event.reason.message || String(event.reason);
        }
      }
      if (isBenignHmrError(reasonStr)) {
        event.preventDefault();
        event.stopPropagation();
        return; // Silently ignore benign HMR/sandbox rejections
      }
      const errBox = document.getElementById('error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerHTML += `<h3>Unhandled Promise Rejection</h3>
          <b>Reason:</b> ${event.reason}`;
      }
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
